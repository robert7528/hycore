name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod tidy
      - name: Check go.mod and go.sum are tidy
        run: git diff --exit-code go.mod go.sum || echo "go.mod/go.sum not tidy"
      - run: go build ./...
      - run: go vet ./...
